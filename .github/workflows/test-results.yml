# Runs Jest + Playwright (CI) and uploads everything under tests/results/ as a workflow artifact.
# Download: Actions → latest run → Artifacts → test-results (zip).

name: Tests & upload results

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare results directory
        run: mkdir -p tests/results

      - name: Jest (unit + integration)
        id: jest
        run: pnpm test 2>&1 | tee tests/results/jest.log
        continue-on-error: true

      - name: Playwright E2E
        id: playwright
        run: CI=1 pnpm test:e2e:ci
        continue-on-error: true

      - name: Upload test results (Playwright report + artifacts + Jest log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job if tests failed
        if: always() && (steps.jest.outcome != 'success' || steps.playwright.outcome != 'success')
        run: |
          echo "Jest outcome: ${{ steps.jest.outcome }}"
          echo "Playwright outcome: ${{ steps.playwright.outcome }}"
          exit 1
